			:root {
				--bg-color: hsl(70 11 5);
				--mg-color: hsl(70 11 12);
				--text-color: hsl(40 24 70);
				--h-color: hsl(70 62 20);
				--accent-color: hsl(70 62 20);
			}

			/* font & base colour settings */
			html {
				font-size: clamp(1rem, 0.8rem + 1vi, 1.25rem);
				font-family:
					system-ui,
					-apple-system,
					BlinkMacSystemFont,

				box-sizing: border-box;
			}

			body {
				scrollbar-gutter: stable both-edges;
				margin-block: 0;
			}

			/* box-sizing fix */
			*:not(img),
			*:before,
			*:after {
				box-sizing: inherit;
			}

			/* layout */

			main,
			article {
				-webkit-margin-before: clamp(1rem, 2vh, 3rem);
				margin-block-start: clamp(1rem, 2vh, 3rem);
				-webkit-margin-after: 6rem;
				margin-block-end: 6rem;
				margin-inline: auto;
				max-inline-size: 100ch;
				padding: 0rem 1rem;
				font-weight: 400;
				grid-column: 2 / 3;
			}

			.flex {
				margin: 2em auto;
				inline-size: calc(100% - 4rem);

				flex-wrap: wrap;

				justify-content: space-around;

			}

			.flex.btn-flex {
				flex-basis: 100%;
			}

			/* elements */

			input[type='checkbox'],
			input[type='radio'] {
				position: relative;
				appearance: none;
				inline-size: 1rem;
				aspect-ratio: 1;
				background: var(--mg-color);
				border: thin solid var(--accent-color);
				border-radius: 5px;

				&:checked {
					&::before {
						content: '';
						background: var(--h-color);
						position: absolute;
						inset: 25%;
						inline-size: 50%;
						aspect-ratio: 1;
						border-radius: 2px;
					}
				}
			}
			input[type='radio'] {
				border-radius: 100%;
				transform: translateY(0.25rem);
				margin-inline-end: 0.75ch;
				&:checked::before {
					border-radius: 100%;
				}
			}

			fieldset {
				background: var(--mg-color);
				border: thin dashed var(--h-color);
				border-radius: 8px;
			}

			fieldset legend {
				font-weight: bold;
				padding-inline: 1ch;
			}

			hr {
				border: none;
				border-block-end: thick solid var(--h-color);
				margin-block: 1rem;
			}
			h1 {
				text-align: center;
			}

			button {
				border: thin solid var(--h-color);
				border-radius: 5px;
				padding: 0.5em 1em;
				background: var(--bg-color);
				font-size: 0.7em;
				text-transform: uppercase;
				color: inherit;
			}

			output {
				display: grid;
				margin-block: 1rem;

							font-size: 1.55em;

			}

			.listless {
				list-style-type: none;
				padding-inline-start: 0;
			}

			#player-list {
				font-size: 1.5rem;
				display: flex;
				gap: 1rem;

				li {

					label {
						padding-inline: 1.5ch;

					button {
						position: absolute;
						inset-block-start: -1ch;
						inset-inline-end: -1ch;
						border: 0;
						border-radius: 5rem;
						background: var(--mg-color);
						color: red;
						font-size: 0.6rem;
					}
				}

    label:has(input[type="checkbox"]) {

    label:has(input:checked) {

    label:has(input[type="checkbox"]:not(:checked)) {
        color: gray;

		</style></head><body><main><!-- <div class="wrapper"> --><h1>Improv Tools</h1><style>

				filter: brightness(100%);
				@starting-style {
					opacity: 0;
					filter: brightness(50%) blur(5px);
				}
			}
		}
	}
</style><toggle-tabs><ul><li><a href="#players">Players</a></li><li><a href="#games">Games</a></li><li><a href="#suggestions">Suggestions</a></li></ul><div id="players"><form id="add-player"><output id="player-output" class="output"><ul></ul></output><div class="flex" id="controls"><button type="button" id="pick-player">Pick a player</button><button type="button" id="reset-checkboxes">Reset checkboxes</button><button type="button" id="remove-all-players">Remove all players</button></div><fieldset class="flex"><legend>Add a new player</legend><label for="player">Name:<input type="text" name="player" id="player"></label><button type="submit">Add player</button></fieldset></form><ul id="player-list" class="listless"></ul></div><div id="games"><form id="game-generator"><output><ul id="current-game" class="listless" hidden><li><strong>Name:</strong> <span id="game-name"></span></li><li><strong>Players:</strong> <span id="game-player-count"></span></li><li id="game-description"></li></ul></output><div class="flex"><button type="submit">Get a game</button><button type="button" id="game-reset">Reset</button></div><fieldset class="flex"><legend>Difficulties</legend><label><input type="checkbox" name="difficulty" value="easy" checked>Easy</label><label><input type="checkbox" name="difficulty" value="medium" checked>Medium</label><label><input type="checkbox" name="difficulty" value="hard" checked>Hard</label></fieldset><fieldset class="flex"><legend>Players</legend><label><input type="checkbox" name="playerCount" value="2" checked>2</label><label><input type="checkbox" name="playerCount" value="3" checked>3</label><label><input type="checkbox" name="playerCount" value="4" checked>4</label><label><input type="checkbox" name="playerCount" value="6">6</label></fieldset><fieldset class="flex"><legend>Categories</legend><label><input type="checkbox" name="tag" value="physical" checked>Physical</label><label><input type="checkbox" name="tag" value="talking heads" checked>Talking He 	customElements.define(
		'toggle-tabs',
		class extends HTMLElement {
			/**
			 * Instantiate the Web Component
			 */
			constructor() {
				// Get parent class properties
				super();
			}

			connectedCallback() {
				console.log('toggle-tabs connected!');
				// Only run if there are tabs
				this.tabList = this.querySelector('ul');
				if (!this.tabList) return;

				// Get the list items and links
				const tabs = this.querySelectorAll('div');
				const listItems = this.tabList.querySelectorAll('li');
				const links = this.tabList.querySelectorAll('a');

				tabs[0].classList.toggle('is-visible');

				// Add ARIA to list
				this.tabList.setAttribute('role', 'tablist');

				// Add ARIA to the list items
				for (let item of listItems) {
					item.setAttribute('role', 'presentation');
				}

				for (let tab of tabs) {
					tab.setAttribute('role', 'tab');
				}
				// Add ARIA to the links and content
				let instance = this;
				links.forEach(function (link, index) {
					// Get the the target element
					let tabPane = instance.querySelector(link.hash);
					if (!tabPane) return;

					// Add [role] and [aria-selected] attributes
					link.setAttribute('role', 'tab');
					link.setAttribute(
						'aria-selected',
						index === 0 ? true : false,
					);

					// If it's not the active (first) tab, remove focus
					if (index > 0) {
						link.setAttribute('tabindex', -1);
					}

					// If there's no ID, add one
					if (!link.id) {
						link.id = `tab_${tabPane.id}`;
					}

					// Add ARIA to tab pane
					tabPane.setAttribute('role', 'tabpanel');
					tabPane.setAttribute('aria-labelledby', link.id);
				});

				// Listen for events
				this.tabList.addEventListener('click', this);
				document.addEventListener('keydown', this);
			}

			/**
			 * Handle events on the Web Component
			 * @param  {Event} event The event object
			 */
			handleEvent(event) {
				this[`on${event.type}`](event);
			}

			/**
			 * Handle click events
			 * @param  {Event} event The event object
			 */
			onclick(event) {
				// Only run on tab links
				if (!event.target.matches('[role="tab"]')) return;

				// Prevent the link from updating the URL
				event.preventDefault();

				// Ignore the currently active tab
				if (event.target.matches('[aria-selected="true"]')) return;

				// Toggle tab visibility
				this.toggle(event.target);
			}

			/**
			 * Handle keydown events
			 * @param  {Event} event The event object
			 */
			onkeydown(event) {
				// Only run for left and right arrow keys
				if (!['ArrowLeft', 'ArrowRight'].includes(event.code)) return;

				// Only run if element in focus is on a tab
				let tab = document.activeElement.closest('[role="tab"]');
				if (!tab) return;

				// Only run if focused tab is in this component
				if (!this.tabList.contains(tab)) return;

				// Get the currently active tab
				let currentTab = this.tabList.querySelector(
					'[role="tab"][aria-selected="true"]',
				);

				// Get the parent list item
				let listItem = currentTab.closest('li');

				// If right arrow, get the next sibling
				// Otherwise, get the previous
				let nextListItem =
					event.code === 'ArrowRight' ?
						listItem.nextElementSibling
					:	listItem.previousElementSibling;
				if (!nextListItem) return;
				let nextTab = nextListItem.querySelector('a');

				// Toggle tab visibility
				this.toggle(nextTab);
				nextTab.focus();
			}

			/**
			 * Toggle tab visibility
			 * @param  {Node} tab The tab to show
			 */
			toggle(newTab) {
				// Get the target tab pane
				let newPane = this.querySelector(newTab.hash);
				if (!newPane) return;

				// Get the current tab and content
				let oldTab = newTab
					.closest('[role="tablist"]')
					.querySelector('[aria-selected="true"]');
				let oldPane = document.querySelector(oldTab.hash);

				oldTab.setAttribute('aria-selected', false);
				oldTab.removeAttribute('tabindex');
				oldPane.classList.toggle('is-visible');

				newTab.setAttribute('aria-selected', true);
				newTab.setAttribute('tabindex', -1);
				newPane.classList.toggle('is-visible');
			}
		},
	);
</script></main><script type="module" src="/improv-tools/suggestions.js"></script><script type="module" src="/improv-tools/games.js"></script><script type="module" src="/improv-tools/players.js"></script></body></html>
